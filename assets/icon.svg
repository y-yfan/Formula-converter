<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#bg)"/>
  <!-- 上方：大写 W -->
  <text x="128" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="bold" fill="white">W</text>
  <!-- 下方：f(x) -->
  <text x="128" y="210" text-anchor="middle" font-family="serif" font-style="italic" font-size="56" fill="rgba(255,255,255,0.85)">f(x)</text>
</svg>
